[workspace]
resolver = "2"
# P2 migration targets imported from risense-ai/respire-cli. crates/app is a
# compatibility facade only; domain ownership remains in crates/app-domain.
members = [
    "crates/client-host",
    "runtime",            # P2 import: bin rsrs-runtime (lands after WP-3 merges in respire-cli)
    "spawn",              # P2 import: durable spawn / boot token / job object (respire_spawn)
    "crates/protocol",    # P2 import: respire_protocol — RPC contract, crates.io source of truth
    "crates/crypto",      # P2 import: respire_crypto
    "crates/storage",     # P2 import: respire_storage
    "crates/core-sdk",    # P2 import: respire_core_sdk — closed-source Core binding (+ core-sdk.lock.json)
    "crates/app-domain",  # P2 import: respire_app_domain — engine-side app layer
    "crates/app",         # P2 transition: compatibility facade consumed by commands
    "crates/commands",    # P2 import: respire_commands — shared command engine (plan §3.3; gated on host-side residue cleanup)
]
default-members = ["runtime"]

# sdk/ holds the core-sdk.lock.json dual lock next to crates/core-sdk's copy;
# it is data-only and intentionally not a Cargo member.

[workspace.package]
edition = "2021"
version = "1.0.20"
repository = "https://github.com/risense-ai/respire-runtime"

[workspace.dependencies]
# Internal crates — path-based for the P2 transition. The version field on
# respire_protocol keeps the registry pin so switching to registry-only
# consumption later is a one-line change per entry.
respire_protocol = { path = "crates/protocol", version = "=2.0.0-dev.8" }
respire_core_sdk = { path = "crates/core-sdk" }
respire_app_domain = { path = "crates/app-domain" }
respire_app = { path = "crates/app" }
respire_storage = { path = "crates/storage" }
respire_crypto = { path = "crates/crypto" }
respire_commands = { path = "crates/commands" }
respire_spawn = { path = "spawn" }

# Shared third-party versions; feature unions cover every imported consumer
# (rusqlite: storage functions + app-domain backup; ureq: core-sdk socks-proxy
# + commands json; uuid: commands v4/v5 + others v4).
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
ureq = { version = "2.12", features = ["json", "socks-proxy"] }
uuid = { version = "1.0", features = ["v4", "v5"] }

# Profile block mirrors respire-cli: match the separately linked Core's unwind
# runtime, avoid host cross-crate LTO, and keep PBKDF2-adjacent hashing fast
# in dev builds.
[profile.release]
strip = "debuginfo"
lto = false
codegen-units = 1
panic = "unwind"

[profile.dev.package.sha2]
opt-level = 3

# Keep the derived clap command builder within the default test-thread stack
# once respire_commands lands (the `respire` entry from the CLI repo does not
# apply here; the runtime bin package has its own name).
[profile.test.package.respire_commands]
opt-level = 1
