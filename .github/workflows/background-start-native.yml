name: Native candidate background startup
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'crates/commands/src/net_rpc.rs'
      - 'spawn/**'
      - 'scripts/test-background-start-native.py'
      - 'scripts/fixtures/client2-background/**'
      - '.github/workflows/background-start-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-client2
          ref: 57bc070826949994c3f7ce9a64277160704bdfe5
          path: .client2-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve exact existing SDK cache
        id: sdk
        run: echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Reverify SDK without private download credentials
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -z "${CORE_SDK_READ_TOKEN:-}"
          node scripts/fetch-core-sdk.mjs "$RUNTIME_TARGET"
      - name: Build actual candidate
        run: cargo build --locked -p respire_runtime --bin rsrs-runtime
      - name: Download and authenticate the published old CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/legacy-cli"
          gh api repos/risense-ai/respire-cli/releases/tags/v1.0.21-dev.6 > "$RUNNER_TEMP/legacy-cli/release.json"
          gh release download v1.0.21-dev.6 --repo risense-ai/respire-cli \
            --pattern "rsrs-$RUNTIME_TARGET" --dir "$RUNNER_TEMP/legacy-cli"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'legacy-cli'
          release = json.loads((root / 'release.json').read_text())
          assert release['tag_name'] == 'v1.0.21-dev.6' and release['prerelease'] and not release['draft']
          binary = root / ('rsrs-' + os.environ['RUNTIME_TARGET'])
          asset, = [entry for entry in release['assets'] if entry['name'] == binary.name]
          data = binary.read_bytes()
          assert len(data) == asset['size']
          assert 'sha256:' + hashlib.sha256(data).hexdigest() == asset['digest']
          binary.chmod(0o700)
          PY
      - name: Exercise background startup, reuse and verified drain
        env:
          LEGACY_CLI_PATH: ${{ runner.temp }}/legacy-cli/rsrs-${{ matrix.target }}
        run: python3 scripts/test-background-start-native.py
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-cli
          ref: f80ac4193487d758d5b02bcdb3e4c3fc3ddabe5d
          path: .cli-source
          persist-credentials: false
      - name: Build the fixed CLI compatibility consumer
        run: cargo build --locked --manifest-path .cli-source/Cargo.toml -p respire --features client2-host-prototype --target-dir .cli-source/target
      - name: Package the actual candidate for the existing CLI installer
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/${{ matrix.target }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/joint-candidate-payload"
          mkdir "$payload"
          cp target/debug/rsrs-runtime "$payload/rsrs-runtime-$RUNTIME_TARGET"
          node scripts/stage-core-runtime.mjs "$payload"
          tar --format=ustar -czf "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" -C "$payload" .
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          payload = root / 'joint-candidate-payload'
          target = os.environ['RUNTIME_TARGET']
          binary = f'rsrs-runtime-{target}'
          archive = root / f'rsrs-runtime-{target}.tar.gz'
          version = tomllib.loads(pathlib.Path('runtime/Cargo.toml').read_text())['package']['version']
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          files = []
          for path in sorted(payload.rglob('*')):
              assert not path.is_symlink(), path
              if path.is_file():
                  files.append({'path': path.relative_to(payload).as_posix(),
                                'size': path.stat().st_size, 'sha256': digest(path)})
          metadata = dict(schema_version=2, runtime_version=version, tag=f'v{version}',
              channel='dev', target_triple=target, archive_file=archive.name,
              archive_sha256=digest(archive), binary_file=binary, binary_sha256=digest(payload / binary),
              source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              compat={'min_cli': '1.0.21-dev.5', 'max_cli': '*'},
              protocol_range={'minimum': 1, 'maximum': 1},
              capabilities={'business_executor': '1', 'mcp_server': '1'}, files=files)
          (root / f'runtime-build-{target}.json').write_text(json.dumps(metadata) + '\n')
          PY
      - name: Exercise unchanged Client2 and CLI against this Runtime candidate
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("runtime/Cargo.toml", "rb"))["package"]["version"])')"
          python3 .cli-source/scripts/test-client2-launcher-compat.py \
            --cli .cli-source/target/debug/rsrs \
            --runtime-archive "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" \
            --runtime-version "$version" --client2-source .client2-source \
            --go "$(command -v go)" --report "$RUNNER_TEMP/joint-candidate-regression.json"
      - name: Preserve joint candidate results (not G1 evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-candidate-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/background-candidate-regression.json
            ${{ runner.temp }}/joint-candidate-regression.json
            ${{ runner.temp }}/runtime-build-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 1
