name: Native candidate background startup
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'crates/commands/src/net_rpc.rs'
      - 'spawn/**'
      - 'scripts/fixtures/embedded-keygen/**'
      - 'scripts/fixtures/client2-background/**'
      - '.github/workflows/background-start-native.yml'
  workflow_dispatch:
    inputs:
      macos_stop_diagnostic:
        description: Run only the source-native macOS standalone stop diagnostic (not G1)
        type: boolean
        default: false
      cli_source_sha:
        description: Exact CLI source commit (required for the macOS stop diagnostic)
        type: string
        default: ''
      legacy_dev_upgrade:
        description: Run the optional issue 285 DEV-to-DEV upgrade diagnostic (unchanged database format)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-background-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_stop_diagnostic && '[{"os":"macos-latest","target":"aarch64-apple-darwin"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate explicit diagnostic inputs
        env:
          MACOS_STOP_DIAGNOSTIC: ${{ inputs.macos_stop_diagnostic }}
          CLI_SOURCE_SHA: ${{ inputs.cli_source_sha }}
          LEGACY_DEV_UPGRADE: ${{ inputs.legacy_dev_upgrade }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['CLI_SOURCE_SHA']
          diagnostic = os.environ['MACOS_STOP_DIAGNOSTIC'] == 'true'
          assert not sha or re.fullmatch(r'[a-f0-9]{40}', sha), 'Exact CLI source SHA required'
          assert not diagnostic or sha, 'macOS stop diagnostic requires cli_source_sha'
          assert not diagnostic or os.environ['LEGACY_DEV_UPGRADE'] != 'true', 'Select one diagnostic'
          PY
      - uses: actions/checkout@v5
        if: inputs.macos_stop_diagnostic != true
        with:
          repository: risense-ai/respire-client2
          ref: 6ffa187685734873721ab51f3a54d8b2c29cd269
          path: .client2-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: inputs.macos_stop_diagnostic != true
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve exact existing SDK cache
        id: sdk
        run: echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Reverify SDK without private download credentials
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -z "${CORE_SDK_READ_TOKEN:-}"
          node scripts/fetch-core-sdk.mjs "$RUNTIME_TARGET"
      - name: Build actual candidate
        run: cargo build --locked -p respire_runtime --bin rsrs-runtime
      - name: Verify native diagnostics stay outside worker IPC
        if: inputs.macos_stop_diagnostic != true
        run: cargo test --locked -p respire_core_sdk --lib core_wire_tests::worker_stdout_keeps_protocol_private -- --exact
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-cli
          ref: ${{ inputs.cli_source_sha || '74b3ae3a4118bd5407d1ee58a12029086bee7359' }}
          path: .cli-source
          persist-credentials: false
      - name: Verify the exact CLI checkout
        env:
          CLI_SOURCE_SHA: ${{ inputs.cli_source_sha || '74b3ae3a4118bd5407d1ee58a12029086bee7359' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, pathlib
          path = pathlib.Path('.cli-source/scripts/native-account-candidate.py')
          spec = importlib.util.spec_from_file_location('paired_source_identity', path)
          original = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(original)
          original.verify_source(pathlib.Path('.cli-source'), os.environ['CLI_SOURCE_SHA'])
          PY
      - name: Build the fixed CLI compatibility consumer
        run: cargo build --locked --manifest-path .cli-source/Cargo.toml -p respire --features client2-host-prototype --target-dir .cli-source/target
      - name: Package the actual candidate for the existing CLI installer
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/${{ matrix.target }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/joint-candidate-payload"
          mkdir "$payload"
          cp target/debug/rsrs-runtime "$payload/rsrs-runtime-$RUNTIME_TARGET"
          node scripts/stage-core-runtime.mjs "$payload"
          tar --format=ustar -czf "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" -C "$payload" .
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          payload = root / 'joint-candidate-payload'
          target = os.environ['RUNTIME_TARGET']
          binary = f'rsrs-runtime-{target}'
          archive = root / f'rsrs-runtime-{target}.tar.gz'
          version = tomllib.loads(pathlib.Path('runtime/Cargo.toml').read_text())['package']['version']
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          files = []
          for path in sorted(payload.rglob('*')):
              assert not path.is_symlink(), path
              if path.is_file():
                  files.append({'path': path.relative_to(payload).as_posix(),
                                'size': path.stat().st_size, 'sha256': digest(path)})
          metadata = dict(schema_version=2, runtime_version=version, tag=f'v{version}',
              channel='dev', target_triple=target, archive_file=archive.name,
              archive_sha256=digest(archive), binary_file=binary, binary_sha256=digest(payload / binary),
              source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              compat={'min_cli': '2.0.0-dev.11', 'max_cli': '*'},
              protocol_range={'minimum': 1, 'maximum': 1},
              capabilities={'business_executor': '1', 'mcp_server': '1', 'offline_keygen_handoff': '1'}, files=files)
          (root / f'runtime-build-{target}.json').write_text(json.dumps(metadata) + '\n')
          PY
      - name: Install isolated Linux credential service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y dbus gnome-keyring
          python3 -m venv "$RUNNER_TEMP/credential-test-python"
          "$RUNNER_TEMP/credential-test-python/bin/python3" -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          echo "$RUNNER_TEMP/credential-test-python/bin" >> "$GITHUB_PATH"
      - name: Download exact public model inputs through the test host
        run: |
          set -euo pipefail
          models="$RUNNER_TEMP/offline-keygen-models"
          mkdir -p "$models/onnx"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/tokenizer.json' --output "$models/tokenizer.json"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_quantized.onnx' --output "$models/onnx/model_quantized.onnx"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://github.com/risense-ai/respire-cli/releases/download/model-bge-m3-ort-v1/model_quantized.cpu-v1.ort' --output "$models/onnx/model_quantized.cpu-v1.ort"
      - name: Exercise paired host lifecycle, restart locking and native key delivery
        if: inputs.macos_stop_diagnostic != true
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("runtime/Cargo.toml", "rb"))["package"]["version"])')"
          command=(python3 scripts/fixtures/embedded-keygen/run.py --cli .cli-source/target/debug/rsrs
            --archive "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" --client2 .client2-source
            --payload "$RUNNER_TEMP/joint-candidate-payload" --binary-file "rsrs-runtime-$RUNTIME_TARGET"
            --models "$RUNNER_TEMP/offline-keygen-models" --version "$version")
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 .cli-source/scripts/dev-secret-service-keyring-selftest.py \
              --root "$RUNNER_TEMP/paired-native-credentials" --timeout 900 -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Build the existing controlled-service account harness
        if: runner.os == 'Linux' || inputs.macos_stop_diagnostic == true
        env:
          HARNESS_FEATURES: ${{ inputs.macos_stop_diagnostic && 'respire_app/cpu-owned-ort-experiment,respire_app_domain/native-credential-fixtures' || 'respire_app_domain/native-credential-fixtures' }}
          MACOS_STOP_DIAGNOSTIC: ${{ inputs.macos_stop_diagnostic }}
        run: |
          set -euo pipefail
          cargo test --locked -p respire_commands --features "$HARNESS_FEATURES" --example cli_business_tests --no-run --message-format=json > "$RUNNER_TEMP/paired-account-harness.jsonl"
          if [[ "$MACOS_STOP_DIAGNOSTIC" == true ]]; then
            RSRS_CORE_SDK_DIR="$PWD/.sdk/$RUNTIME_TARGET" node scripts/stage-core-runtime.mjs target/debug/examples
          fi
      - name: Diagnose source-native macOS standalone stop with the original isolated HOME
        if: inputs.macos_stop_diagnostic == true
        env:
          CLI_SOURCE_SHA: ${{ inputs.cli_source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('.cli-source/scripts').resolve()))
          from importlib.util import module_from_spec, spec_from_file_location
          def load(name, path):
              spec = spec_from_file_location(name, path)
              module = module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          original = load('paired_stop_assertions', '.cli-source/scripts/native-account-candidate.py')
          stop = load('paired_stop_driver', 'scripts/run-runtime-g1-stop.py')
          native = load('paired_stop_credentials', '.cli-source/scripts/dev-migration-keyring-selftest.py')
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root = temp / 'macos-stop-diagnostic'
          root.mkdir(mode=0o700)
          report = dict(schema=1, passed=False, test_executed=False, release_acceptance=False,
              g1_passed=False, evidence_class='source-native-diagnostic', target=os.environ['RUNTIME_TARGET'],
              runtime_source_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              cli_source_sha=os.environ['CLI_SOURCE_SHA'], home_isolation='unchanged-g1-stop', stage='preparation')
          manager = None
          try:
              assert sys.platform == 'darwin'
              original.verify_source(pathlib.Path('.cli-source'), report['cli_source_sha'])
              records = [json.loads(line) for line in (temp / 'paired-account-harness.jsonl').read_text().splitlines()]
              binaries = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact'
                  and r.get('target', {}).get('name') == 'cli_business_tests'
                  and r.get('profile', {}).get('test') is True and r.get('executable')]
              assert len(binaries) == 1
              harness = pathlib.Path(binaries[0]).resolve(strict=True)
              metadata = temp / ('runtime-build-' + report['target'] + '.json')
              request = dict(cli=str(pathlib.Path('.cli-source/target/debug/rsrs').resolve(strict=True)),
                  runtime_metadata=str(metadata), cli_source_sha=report['cli_source_sha'],
                  source_sha=report['runtime_source_sha'])
              for name in ('home', 'data', 'config', 'cache', 'runtime', 'tmp', 'installation', 'cli'):
                  (root / name).mkdir()
              env = stop.environment(root, request)
              cli = pathlib.Path(env['RSRS_CLI_BIN'])
              shutil.copy2(request['cli'], cli)
              report['cli_binary_sha256'] = original.digest(cli)
              report['harness_sha256'] = original.digest(harness)
              report['runtime_binary_sha256'] = json.loads(metadata.read_bytes())['binary_sha256']
              shutil.copytree(temp / 'offline-keygen-models', root / 'model')
              for name, sha in original.MODEL_HASHES.items():
                  assert original.digest(root / 'model' / name) == sha
              with (root / 'private.log').open('wb') as log:
                  subprocess.run([str(cli), '--json', 'runtime', 'install', '--file',
                      str(temp / ('rsrs-runtime-' + report['target'] + '.tar.gz')), '--version',
                      json.loads(metadata.read_bytes())['runtime_version']], env=env, stdout=log, stderr=log, check=True)
                  installed = original.verify_receipt(root / 'installation', metadata)
                  assert str(installed) == env['RSRS_RUNTIME_BIN']
                  report['stage'] = 'credential_setup'
                  manager = native.backend.create(root / 'credentials')
                  env = manager.configure_env(env)
                  env['RSRS_TEST_NATIVE_KEYCHAIN'] = str(manager.keychain)
                  before = {}
                  native.roundtrips(manager, before)
                  assert len(before) == 8
                  report['stage'] = 'stop_harness'
                  # File output cannot keep Python waiting on a pipe inherited by a detached child.
                  with (root / 'harness-private.log').open('wb') as harness_log:
                      process = subprocess.run([str(harness), stop.CASE, '--exact', '--test-threads=1', '--show-output'],
                          env=env, stdout=harness_log, stderr=subprocess.STDOUT)
                  captured = (root / 'harness-private.log').read_bytes()
                  report['exit_code'] = process.returncode
                  report['test_executed'] = f'test {stop.CASE} ... '.encode() in captured
                  # Only existing allowlist parsers may publish product diagnostics, including numeric OSStatus.
                  report['failure_diagnostics'] = original.safe_failure_diagnostics(captured,
                      [stop.CASE] if process.returncode else [])
                  report['accepted_write_checkpoints'] = stop.accepted_write_checkpoints(captured)
                  report['stop_diagnostics'] = stop.stop_failure_diagnostics(captured)
                  assert process.returncode == 0, 'Native standalone stop failed'
                  report['stage'] = 'stop_assertions'
                  stop.passed_case(captured)
                  report['standalone'] = original.standalone_stop_checks(captured, report['runtime_binary_sha256'])
                  assert report['standalone']['passed']
                  report['stage'] = 'credential_after'
                  after = {}
                  native.roundtrips(manager, after)
                  assert len(after) == 8
                  assert original.digest(cli) == report['cli_binary_sha256']
                  assert original.digest(harness) == report['harness_sha256']
                  assert original.digest(installed) == report['runtime_binary_sha256']
                  report.update(passed=True, stage='complete')
          except Exception as error:
              report['failure_type'] = type(error).__name__
          finally:
              if manager is not None:
                  try:
                      report['keyring_cleanup'] = manager.cleanup()
                      assert report['keyring_cleanup']['passed'] and not report['keyring_cleanup']['remaining_entries']
                  except Exception as error:
                      report.update(passed=False, cleanup_failure_type=type(error).__name__)
              original.write_json(root / 'result.json', report)
          sys.exit(0 if report['passed'] and report['test_executed'] else 1)
          PY
      - name: Exercise account authorization and sync with the exact paired sources
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          harness="$(python3 - <<'PYHARNESS'
          import json,os,pathlib
          records=[json.loads(line) for line in (pathlib.Path(os.environ['RUNNER_TEMP'])/'paired-account-harness.jsonl').read_text().splitlines()]
          binaries=[record['executable'] for record in records if record.get('reason')=='compiler-artifact'
            and record.get('target',{}).get('name')=='cli_business_tests'
            and record.get('profile',{}).get('test') is True and record.get('executable')]
          assert len(binaries)==1
          print(binaries[0])
          PYHARNESS
          )"
          python3 .cli-source/scripts/native-account-candidate.py \
            --root "$RUNNER_TEMP/paired-account-business" --cli-source "$PWD/.cli-source" --runtime-source "$PWD" \
            --cli-sha "$(git -C .cli-source rev-parse HEAD)" --runtime-sha "$(git rev-parse HEAD)" \
            --cli .cli-source/target/debug/rsrs \
            --runtime "$RUNNER_TEMP/joint-candidate-payload/rsrs-runtime-$RUNTIME_TARGET" \
            --harness "$harness" --suite account
      - name: Download the official issue 285 macOS baseline
        if: runner.os == 'macOS' && inputs.legacy_dev_upgrade == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.0.0-dev.3 --repo risense-ai/respire-cli \
            --pattern rsrs-aarch64-apple-darwin \
            --pattern cli-build-aarch64-apple-darwin.json --dir "$RUNNER_TEMP/dev3"
          chmod +x "$RUNNER_TEMP/dev3/rsrs-aarch64-apple-darwin"
      - name: Upgrade the original-path dev.3 dev.14 fixture to the exact paired candidate
        if: runner.os == 'macOS' && inputs.legacy_dev_upgrade == true
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("runtime/Cargo.toml", "rb"))["package"]["version"])')"
          python3 .cli-source/scripts/test-dev3-in-place-upgrade.py \
            --old-cli "$RUNNER_TEMP/dev3/rsrs-aarch64-apple-darwin" \
            --old-metadata "$RUNNER_TEMP/dev3/cli-build-aarch64-apple-darwin.json" \
            --candidate .cli-source/target/debug/rsrs \
            --candidate-runtime-archive "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" \
            --candidate-runtime-version "$version" \
            --m3-dir "$RUNNER_TEMP/offline-keygen-models" --root "$RUNNER_TEMP/issue-285"
      - name: Preserve joint candidate results (not G1 evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-candidate-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-host-credentials.json
            ${{ runner.temp }}/runtime-build-${{ matrix.target }}.json
            ${{ runner.temp }}/issue-285/upgrade-report.json
            ${{ runner.temp }}/paired-account-business/result.json
            ${{ runner.temp }}/macos-stop-diagnostic/result.json
          if-no-files-found: warn
          retention-days: 1
