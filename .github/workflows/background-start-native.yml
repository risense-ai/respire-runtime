name: Native candidate background startup
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'crates/commands/src/net_rpc.rs'
      - 'spawn/**'
      - 'scripts/fixtures/embedded-keygen/**'
      - 'scripts/fixtures/client2-background/**'
      - '.github/workflows/background-start-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-client2
          ref: 1734322b6c6dd543441a753f07a3517bee5e1231
          path: .client2-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve exact existing SDK cache
        id: sdk
        run: echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Reverify SDK without private download credentials
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -z "${CORE_SDK_READ_TOKEN:-}"
          node scripts/fetch-core-sdk.mjs "$RUNTIME_TARGET"
      - name: Build actual candidate
        run: cargo build --locked -p respire_runtime --bin rsrs-runtime
      - name: Verify native diagnostics stay outside worker IPC
        run: cargo test --locked -p respire_core_sdk --lib core_wire_tests::worker_stdout_keeps_protocol_private -- --exact
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-cli
          ref: be2f84a322353e6ebb4a86c96f17f016a2348a32
          path: .cli-source
          persist-credentials: false
      - name: Build the fixed CLI compatibility consumer
        run: cargo build --locked --manifest-path .cli-source/Cargo.toml -p respire --features client2-host-prototype --target-dir .cli-source/target
      - name: Package the actual candidate for the existing CLI installer
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/${{ matrix.target }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/joint-candidate-payload"
          mkdir "$payload"
          cp target/debug/rsrs-runtime "$payload/rsrs-runtime-$RUNTIME_TARGET"
          node scripts/stage-core-runtime.mjs "$payload"
          tar --format=ustar -czf "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" -C "$payload" .
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          payload = root / 'joint-candidate-payload'
          target = os.environ['RUNTIME_TARGET']
          binary = f'rsrs-runtime-{target}'
          archive = root / f'rsrs-runtime-{target}.tar.gz'
          version = tomllib.loads(pathlib.Path('runtime/Cargo.toml').read_text())['package']['version']
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          files = []
          for path in sorted(payload.rglob('*')):
              assert not path.is_symlink(), path
              if path.is_file():
                  files.append({'path': path.relative_to(payload).as_posix(),
                                'size': path.stat().st_size, 'sha256': digest(path)})
          metadata = dict(schema_version=2, runtime_version=version, tag=f'v{version}',
              channel='dev', target_triple=target, archive_file=archive.name,
              archive_sha256=digest(archive), binary_file=binary, binary_sha256=digest(payload / binary),
              source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              compat={'min_cli': '1.0.21-dev.5', 'max_cli': '*'},
              protocol_range={'minimum': 1, 'maximum': 1},
              capabilities={'business_executor': '1', 'mcp_server': '1', 'offline_keygen_handoff': '1'}, files=files)
          (root / f'runtime-build-{target}.json').write_text(json.dumps(metadata) + '\n')
          PY
      - name: Install isolated Linux credential service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y dbus gnome-keyring
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
      - name: Download exact public model inputs through the test host
        run: |
          set -euo pipefail
          models="$RUNNER_TEMP/offline-keygen-models"
          mkdir -p "$models/onnx"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/tokenizer.json' --output "$models/tokenizer.json"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_quantized.onnx' --output "$models/onnx/model_quantized.onnx"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 1200 'https://github.com/risense-ai/respire-cli/releases/download/model-bge-m3-ort-v1/model_quantized.cpu-v1.ort' --output "$models/onnx/model_quantized.cpu-v1.ort"
      - name: Exercise paired host lifecycle, restart locking and native key delivery
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("runtime/Cargo.toml", "rb"))["package"]["version"])')"
          command=(python3 scripts/fixtures/embedded-keygen/run.py --cli .cli-source/target/debug/rsrs
            --archive "$RUNNER_TEMP/rsrs-runtime-$RUNTIME_TARGET.tar.gz" --client2 .client2-source
            --payload "$RUNNER_TEMP/joint-candidate-payload" --binary-file "rsrs-runtime-$RUNTIME_TARGET"
            --models "$RUNNER_TEMP/offline-keygen-models" --version "$version")
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- env RSRS_SS_FIXTURE_BUS=private python3 .cli-source/scripts/dev-secret-service-keyring-selftest.py \
              --root "$RUNNER_TEMP/paired-native-credentials" --timeout 900 -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Preserve joint candidate results (not G1 evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-candidate-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-host-credentials.json
            ${{ runner.temp }}/runtime-build-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 1
