name: Runtime musl Granite recall regression
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Runtime repair commit to build and test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  granite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact SDK cache identity
        id: sdk
        working-directory: runtime-source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cmp sdk/core-sdk.lock.json crates/core-sdk/core-sdk.lock.json
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: .sdk/${{ env.TARGET }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: target/musl-cache
          key: musl-x86_64-unknown-linux-musl-ort-da9b5e3-rust-1.95-v1
      - name: Build the static x64 musl candidate
        working-directory: runtime-source
        env:
          EXPECTED: ${{ steps.sdk.outputs.key }}
          RESTORED: ${{ steps.sdk-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED" && test "$EXPECTED" = "$RESTORED"
          test -z "${CORE_SDK_READ_TOKEN:-}"
          bash scripts/build-linux-musl.sh "$TARGET"
      - name: Fetch pinned IBM Granite assets
        run: |
          set -euo pipefail
          mkdir candidate
          base=https://huggingface.co/ibm-granite/granite-embedding-311m-multilingual-r2/resolve/44399559930365213510b1ee2eb15ded83374f0e
          curl -fsSL --retry 2 "$base/onnx/model_quint8_avx2.onnx" -o candidate/granite.onnx
          curl -fsSL --retry 2 "$base/tokenizer.json" -o candidate/tokenizer.json
          sha256sum -c <<'HASHES'
          f1fdd44e7e1ac51f12ab7957c7bd092e064d596c288513bf9d326842f669edee  candidate/granite.onnx
          0087c868b33bad550a78a08d19798cfd7f713cde4f020803b8f51f405503e15f  candidate/tokenizer.json
          HASHES
      - name: Probe recall during the real Granite switch in Alpine
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir benchmark-report
          payload="target/ci/$TARGET/release"
          sha=$(sha256sum "$payload/rsrs-runtime" | cut -d' ' -f1)
          jq -n --arg source "$CANDIDATE_SHA" --arg binary "$sha" --arg path "$payload" \
            '{source_commit:$source,binary_sha256:$binary,binary_file:"rsrs-runtime",payload:$path}' \
            > "candidate/runtime-build-$TARGET.json"
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-alpine \
            node harness/scripts/granite-recall-busy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite-musl-recall-busy
          path: |
            benchmark-report/
            candidate/runtime-build-*.json
          if-no-files-found: warn
