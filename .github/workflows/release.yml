name: Runtime release

# Builds rsrs-runtime for all seven platform targets, runs the full native
# regression matrix and publishes the release assets:
#   rsrs-runtime-<triple>(.exe)      raw binary
#   rsrs-runtime-<triple>.tar.gz     binary + core-runtime.json + native Core
#                                    runtime libraries and notices
#   runtime-build-<triple>.json      version/tag/triple/SHA-256/compat metadata
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Runtime branch, commit, vX.Y.Z or vX.Y.Z-dev.N tag
        default: main
        required: true
        type: string
      publish:
        description: Publish only after every synchronous gate succeeds
        default: false
        type: boolean
      dev_version:
        description: Exact DEV version (X.Y.Z-dev.N) for manual branch/commit builds; required when ref is not a v* tag
        default: ''
        type: string

permissions:
  contents: read

# Every publication holds this lock so two releases can never interleave.
concurrency:
  group: runtime-release-publication
  queue: max
  cancel-in-progress: false

env:
  # CLI compatibility window embedded into every runtime-build-<triple>.json.
  # Source of truth for the contract: docs/version-contract.md.
  RUNTIME_MIN_CLI: '1.0.20'
  RUNTIME_MAX_CLI: '*'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the migrated runtime workspace (phase P2 gate)
        run: |
          if [ ! -f runtime/Cargo.toml ]; then
            echo "::error::The runtime workspace has not been migrated yet (phase P2 subtree migration). This workflow is complete but intentionally refuses to run against the skeleton."
            exit 1
          fi
      - id: plan
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_DEV_VERSION: ${{ inputs.dev_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process');
          const cargo = fs.readFileSync('runtime/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!cargo) throw new Error('runtime/Cargo.toml has no version');
          const ref = process.env.RELEASE_REF.replace(/^refs\/tags\//, '');
          const tagEvent = process.env.RELEASE_REF.startsWith('refs/tags/') || /^v\d+\./.test(ref);
          let channel, version;
          if (tagEvent) {
            if (process.env.RELEASE_DEV_VERSION) throw new Error('A release tag cannot be combined with an exact DEV override');
            if (!/^v\d+\.\d+\.\d+(?:-dev\.\d+)?$/.test(ref)) throw new Error('Release tags must use vX.Y.Z or vX.Y.Z-dev.N');
            version = ref.slice(1);
            channel = version.includes('-dev.') ? 'dev' : 'latest';
            if (cargo !== version) throw new Error('Release tag must exactly match the runtime source version');
            cp.execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          } else {
            if (!/^\d+\.\d+\.\d+-dev\.\d+$/.test(process.env.RELEASE_DEV_VERSION || '')) throw new Error('Manual non-tag builds require the dev_version input (X.Y.Z-dev.N)');
            version = process.env.RELEASE_DEV_VERSION;
            channel = 'dev';
            if (process.env.RELEASE_PUBLISH === 'true') cp.execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          }
          const sha = cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nversion=${version}\ntag=v${version}\nchannel=${channel}\npublish=${process.env.RELEASE_PUBLISH}\n`);
          console.log(`Planned runtime release ${version} (${channel}) from ${sha}, publish=${process.env.RELEASE_PUBLISH}`);
          NODE

  build:
    name: Release (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=-crt-static
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: -C target-feature=-crt-static
    env:
      # Match the separately linked Core's unwind runtime; keep the Windows CRT dynamic.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Require native Windows ARM64 hardware
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Windows ARM64 acceptance requires native ARM64 hardware'
          }
      - name: Require real native Linux ARM64 hardware
        shell: bash
        run: bash scripts/require-native-linux-arm64.sh '${{ matrix.target }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Resolve the pinned SDK dependency cache
        id: sdk-cache
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$target")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk-cache-restore
        if: steps.sdk-cache.outputs.key != ''
        with:
          path: .sdk/${{ steps.sdk-cache.outputs.target }}
          key: ${{ steps.sdk-cache.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require the exact SDK cache match
        if: steps.sdk-cache.outputs.key != ''
        shell: bash
        env:
          EXPECTED_KEY: ${{ steps.sdk-cache.outputs.key }}
          MATCHED_KEY: ${{ steps.sdk-cache-restore.outputs.cache-matched-key }}
        run: test -n "$EXPECTED_KEY" && test "$MATCHED_KEY" = "$EXPECTED_KEY"
      # NOTE: respire-core's sdk-link.yml currently validates its GNU SDK through a
      # fixed CLI consumer pinned at risense-ai/respire-cli@406399841208bf865d8f40c72dbbf6450fb3a44b
      # (sdk-link.yml, "Checkout the fixed reviewed CLI consumer"). After the P2
      # migration lands, update that pin to a consumer commit from this repository;
      # respire-runtime becomes the Core-linked source of truth.
      - name: Prepare pinned binary Core SDK
        if: ${{ !contains(matrix.target, '-musl') }}
        shell: bash
        run: node scripts/fetch-core-sdk.mjs '${{ matrix.target }}'
      - name: Resolve the build directory
        id: builddir
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.target }}' == *-musl ]]; then
            # scripts/build-linux-musl.sh builds inside its container into target/ci.
            echo "dir=target/ci/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=target/release-build/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release binary
        if: ${{ !contains(matrix.target, '-musl') }}
        shell: bash
        run: |
          cargo build --release --locked -p respire_runtime --bin rsrs-runtime \
            --target '${{ matrix.target }}' --target-dir target/release-build
      - uses: actions/cache/restore@v4
        if: contains(matrix.target, '-musl')
        id: musl-cache
        with:
          path: target/musl-cache
          key: musl-${{ matrix.target }}-ort-da9b5e3-rust-1.95-v1
      - name: Build static musl binary and verify libc independence
        if: contains(matrix.target, '-musl')
        shell: bash
        run: bash scripts/build-linux-musl.sh '${{ matrix.target }}'
      # The musl container already stages its payload as root; a second host
      # staging pass cannot chmod those notices and changes nothing.
      - name: Stage the Core runtime payload next to the binary
        if: ${{ !contains(matrix.target, '-musl') }}
        shell: bash
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/${{ matrix.target }}
        run: node scripts/stage-core-runtime.mjs '${{ steps.builddir.outputs.dir }}'
      - name: Assemble the release archive and metadata
        id: assemble
        shell: bash
        env:
          RUNTIME_VERSION: ${{ needs.plan.outputs.version }}
          RUNTIME_TAG: ${{ needs.plan.outputs.tag }}
          RUNTIME_CHANNEL: ${{ needs.plan.outputs.channel }}
          RUNTIME_TARGET: ${{ matrix.target }}
          BUILD_DIR: ${{ steps.builddir.outputs.dir }}
        run: |
          set -euo pipefail
          target="$RUNTIME_TARGET"
          suffix=''; if [[ "$target" == *windows* ]]; then suffix='.exe'; fi
          # Cargo emits the bare binary name; every published artifact and the
          # runtime-build metadata use the triple-qualified release name that
          # the CLI downloader and client2 validate against.
          built="rsrs-runtime$suffix"
          binary="rsrs-runtime-$target$suffix"
          export RUNTIME_BINARY_FILE="$binary"
          test -f "$BUILD_DIR/$built" || { echo "::error::Built binary missing at $BUILD_DIR/$built"; exit 1; }
          test -f "$BUILD_DIR/core-runtime.json" || { echo "::error::Staged core-runtime.json missing; the SDK staging step failed silently"; exit 1; }
          test -d "$BUILD_DIR/core-notices" || { echo "::error::Staged Core SDK notices missing"; exit 1; }
          rm -rf payload; mkdir payload
          cp "$BUILD_DIR/$built" "payload/$binary"
          cp "$BUILD_DIR/core-runtime.json" payload/core-runtime.json
          # The dev.21 Core SDK statically links Core FFI into the runtime
          # binary; a separate runtime/ payload exists only for dynamic SDKs.
          if [ -d "$BUILD_DIR/runtime" ]; then cp -R "$BUILD_DIR/runtime" payload/runtime; fi
          cp -R "$BUILD_DIR/core-notices" payload/core-notices
          if [ -n "$(find payload -type l -print -quit)" ]; then
            echo "::error::Symlinked release payloads are forbidden"
            exit 1
          fi
          export RUNTIME_BINARY_FILE="$binary"
          tar -czf "rsrs-runtime-$target.tar.gz" -C payload .
          node - <<'NODE'
          const cp = require('child_process');
          const target = process.env.RUNTIME_TARGET;
          const binary = `rsrs-runtime-${target}${target.includes('windows') ? '.exe' : ''}`;
          const archive = `rsrs-runtime-${process.env.RUNTIME_TARGET}.tar.gz`;
          const entries = cp.execFileSync('tar', ['-tzf', archive], {encoding: 'utf8'})
            .split(/\r?\n/).filter(Boolean);
          let runtimeFiles = 0, noticeFiles = 0;
          for (const raw of entries) {
            const entry = raw.replace(/^\.\//, '').replace(/\/$/, '');
            if (!entry || entry === '.') continue;
            const safePath = !entry.includes('\\') && !entry.startsWith('/') &&
              entry.split('/').every(part => part && part !== '.' && part !== '..');
            const withinWhitelist = entry === binary || entry === 'core-runtime.json' ||
              entry === 'runtime' || entry === 'core-notices' ||
              entry.startsWith('runtime/') || entry.startsWith('core-notices/');
            if (!safePath || !withinWhitelist) throw new Error(`Unsafe archive path: ${entry}`);
            if (entry.startsWith('runtime/')) ++runtimeFiles;
            if (entry.startsWith('core-notices/')) ++noticeFiles;
          }
          for (const name of [binary, 'core-runtime.json']) {
            if (!entries.some(entry => entry.replace(/^\.\//, '') === name)) throw new Error(`Archive is missing ${name}`);
          }
          if (!noticeFiles) throw new Error('Archive is missing redistribution notices');
          console.log(`Verified archive whitelist: ${entries.length} entries; runtime files: ${runtimeFiles}`);
          NODE
          tar_sha256="$(sha256sum "rsrs-runtime-$target.tar.gz" | cut -d ' ' -f 1)"
          binary_sha256="$(sha256sum "payload/$binary" | cut -d ' ' -f 1)"
          export RUNTIME_TAR_SHA256="$tar_sha256" RUNTIME_BINARY_SHA256="$binary_sha256" RUNTIME_BINARY_FILE="$binary"
          node - <<'NODE'
          const fs = require('fs');
          const report = {
            schema_version: 1,
            runtime_version: process.env.RUNTIME_VERSION,
            tag: process.env.RUNTIME_TAG,
            channel: process.env.RUNTIME_CHANNEL,
            triple: process.env.RUNTIME_TARGET,
            sha256: process.env.RUNTIME_TAR_SHA256,
            binary_file: process.env.RUNTIME_BINARY_FILE,
            binary_sha256: process.env.RUNTIME_BINARY_SHA256,
            compat: {min_cli: process.env.RUNTIME_MIN_CLI, max_cli: process.env.RUNTIME_MAX_CLI}
          };
          if (!/^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$/.test(report.runtime_version)) throw new Error('Invalid runtime_version');
          for (const field of ['sha256', 'binary_sha256']) {
            if (!/^[a-f0-9]{64}$/.test(report[field])) throw new Error(`Invalid ${field}`);
          }
          for (const field of ['min_cli', 'max_cli']) {
            if (typeof report.compat[field] !== 'string') throw new Error(`Invalid compat.${field}`);
          }
          fs.writeFileSync(`runtime-build-${process.env.RUNTIME_TARGET}.json`, JSON.stringify(report, null, 2) + '\n');
          NODE
          echo "tar_sha256=$tar_sha256" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$binary_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: runtime-release-${{ matrix.target }}
          path: |
            rsrs-runtime-${{ matrix.target }}.tar.gz
            runtime-build-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: runtime-release-binary-${{ matrix.target }}
          path: payload/rsrs-runtime*
          if-no-files-found: error

  native-regression:
    # Full native regression ownership moved here from respire-cli (seven-platform
    # matrix with real-hardware gates). P2 extends this job with the migrated
    # inference, migration and startup-supervision regression suites; the serve/
    # health smoke below already exercises the real binary end to end.
    name: Native regression (${{ matrix.target }})
    needs: [plan, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Require native Windows ARM64 hardware
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Windows ARM64 acceptance requires native ARM64 hardware'
          }
      - name: Require real native Linux ARM64 hardware
        shell: bash
        run: bash scripts/require-native-linux-arm64.sh '${{ matrix.target }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for this platform's build artifacts
        timeout-minutes: 16
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const repo = process.env.GITHUB_REPOSITORY, run = process.env.GITHUB_RUN_ID, target = process.env.RUNTIME_TARGET;
          const names = [`runtime-release-${target}`, `runtime-release-binary-${target}`];
          const deadline = Date.now() + 15 * 60 * 1000;
          const read = path => JSON.parse(cp.execFileSync('gh', ['api', `repos/${repo}/actions/runs/${run}/${path}`], {encoding: 'utf8', timeout: 30000}));
          async function wait() {
            while (Date.now() < deadline) {
              const found = read('artifacts?per_page=100').artifacts.filter(a => names.includes(a.name) && !a.expired);
              if (found.length === names.length) { console.log(`Build artifacts ready: ${names.join(', ')}`); return; }
              console.log(`Waiting for ${names.join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error(`Build artifacts ${names.join(', ')} unavailable within 15 minutes`);
          }
          wait().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-release-*-${{ matrix.target }}
          path: release-assets
          merge-multiple: true
      - name: Verify archive and binary digests against the build report
        shell: bash
        env:
          RUNTIME_VERSION: ${{ needs.plan.outputs.version }}
          RUNTIME_TAG: ${{ needs.plan.outputs.tag }}
          RUNTIME_TARGET: ${{ matrix.target }}
          EXPECTED_MIN_CLI: ${{ env.RUNTIME_MIN_CLI }}
          EXPECTED_MAX_CLI: ${{ env.RUNTIME_MAX_CLI }}
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process');
          const target = process.env.RUNTIME_TARGET, version = process.env.RUNTIME_VERSION;
          const report = JSON.parse(fs.readFileSync(`release-assets/runtime-build-${target}.json`, 'utf8'));
          const required = {runtime_version: version, tag: process.env.RUNTIME_TAG, triple: target,
            binary_file: `rsrs-runtime-${target}${target.includes('windows') ? '.exe' : ''}`};
          for (const [key, value] of Object.entries(required)) {
            if (report[key] !== value) throw new Error(`runtime-build ${key} differs: ${report[key]} != ${value}`);
          }
          const compat = report.compat || {};
          if (compat.min_cli !== process.env.EXPECTED_MIN_CLI || compat.max_cli !== process.env.EXPECTED_MAX_CLI) {
            throw new Error('runtime-build compat window differs from the workflow contract');
          }
          const digest = file => cp.execFileSync('sha256sum', [file], {encoding: 'utf8'}).split(' ')[0];
          if (digest(`release-assets/rsrs-runtime-${target}.tar.gz`) !== report.sha256) throw new Error('Archive SHA-256 mismatch');
          if (digest(`release-assets/${report.binary_file}`) !== report.binary_sha256) throw new Error('Binary SHA-256 mismatch');
          console.log(`Verified ${target} digests for runtime ${version}`);
          NODE
      - name: Runtime serve/health/stop smoke on the real binary
        shell: bash
        env:
          RUNTIME_VERSION: ${{ needs.plan.outputs.version }}
          RUNTIME_TARGET: ${{ matrix.target }}
          EXPECTED_MIN_CLI: ${{ env.RUNTIME_MIN_CLI }}
          EXPECTED_MAX_CLI: ${{ env.RUNTIME_MAX_CLI }}
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process'), os = require('os'), path = require('path');
          const target = process.env.RUNTIME_TARGET, version = process.env.RUNTIME_VERSION;
          const report = JSON.parse(fs.readFileSync(`release-assets/runtime-build-${target}.json`, 'utf8'));
          const exe = path.resolve('release-assets', report.binary_file);
          fs.chmodSync(exe, 0o755);
          const dataDir = fs.mkdtempSync(path.join(os.tmpdir(), 'rsrs-runtime-smoke-'));
          const port = 15000 + (process.pid % 20000);
          const child = cp.spawn(exe, ['serve', '--host', '127.0.0.1', '--port', String(port), '--data-dir', dataDir],
            {stdio: ['ignore', 'ignore', 'inherit']});
          const stop = () => { try { child.kill(); } catch {} };
          process.on('exit', stop);
          const deadline = Date.now() + 60000;
          (async () => {
            const fail = async message => {
              console.error(`::error::${message}`);
              stop();
              process.exit(1);
            };
            let health = null;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`http://127.0.0.1:${port}/health`, {signal: AbortSignal.timeout(3000)});
                if (response.ok) { health = await response.json(); break; }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!health) await fail(`Health endpoint on port ${port} never became ready`);
            if (health.ok !== true) await fail(`Health reported ok=${health.ok}`);
            if (health.runtime_version !== version) await fail(`Health runtime_version ${health.runtime_version} != ${version}`);
            const compat = health.runtime_compat || {};
            if (compat.min_cli !== process.env.EXPECTED_MIN_CLI || compat.max_cli !== process.env.EXPECTED_MAX_CLI) {
              await fail(`Health runtime_compat ${JSON.stringify(compat)} differs from the workflow contract`);
            }
            stop();
            fs.mkdirSync('smoke-report', {recursive: true});
            fs.writeFileSync(`smoke-report/runtime-smoke-${target}.json`,
              JSON.stringify({target, version, port, runtime_version: health.runtime_version,
                runtime_compat: compat, inference_state: health.inference?.state ?? null, passed: true}, null, 2) + '\n');
            console.log(`Serve/health smoke passed on ${target}: runtime ${version}`);
            process.exit(0);
          })().catch(error => { console.error(error); stop(); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: runtime-smoke-${{ matrix.target }}
          path: smoke-report/*.json
          if-no-files-found: warn

  publish:
    needs: [plan, build, native-regression]
    if: >-
      ${{
        !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' &&
        needs.native-regression.result == 'success' && needs.plan.outputs.publish == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify the complete seven-platform asset inventory and digests
        env:
          RUNTIME_VERSION: ${{ needs.plan.outputs.version }}
          RUNTIME_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process');
          const targets = ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-unknown-linux-musl',
            'aarch64-unknown-linux-musl', 'aarch64-apple-darwin', 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'];
          const expected = [];
          for (const target of targets) {
            expected.push(`rsrs-runtime-${target}.tar.gz`, `runtime-build-${target}.json`);
            expected.push(target.includes('windows') ? `rsrs-runtime-${target}.exe` : `rsrs-runtime-${target}`);
          }
          expected.sort();
          const digest = file => cp.execFileSync('sha256sum', [file], {encoding: 'utf8'}).split(' ')[0];
          for (const target of targets) {
            const report = JSON.parse(fs.readFileSync(`release-assets/runtime-build-${target}.json`, 'utf8'));
            if (report.runtime_version !== process.env.RUNTIME_VERSION || report.tag !== process.env.RUNTIME_TAG || report.triple !== target) {
              throw new Error(`runtime-build-${target}.json identity mismatch`);
            }
            if (report.compat?.min_cli !== process.env.RUNTIME_MIN_CLI || report.compat?.max_cli !== process.env.RUNTIME_MAX_CLI) {
              throw new Error(`runtime-build-${target}.json compat window mismatch`);
            }
            for (const [file, field] of [[`rsrs-runtime-${target}.tar.gz`, 'sha256'], [report.binary_file, 'binary_sha256']]) {
              if (!fs.existsSync(`release-assets/${file}`)) throw new Error(`Missing release asset: ${file}`);
              if (digest(`release-assets/${file}`) !== report[field]) throw new Error(`SHA-256 mismatch for ${file}`);
            }
          }
          const actual = fs.readdirSync('release-assets').sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Asset inventory mismatch:\nexpected ${JSON.stringify(expected, null, 2)}\nactual   ${JSON.stringify(actual, null, 2)}`);
          }
          console.log(`Verified ${expected.length} release assets for runtime ${process.env.RUNTIME_VERSION}`);
          NODE
      - name: Create the draft release and upload every verified asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ needs.plan.outputs.tag }}
          RUNTIME_SHA: ${{ needs.plan.outputs.sha }}
          RUNTIME_CHANNEL: ${{ needs.plan.outputs.channel }}
          RUNTIME_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          notes="rsrs-runtime ${RUNTIME_VERSION} (${RUNTIME_CHANNEL})."
          if gh release view "$RUNTIME_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RUNTIME_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already public; use a new version'; exit 1; }
            gh release edit "$RUNTIME_TAG" --target "$RUNTIME_SHA" --title "$RUNTIME_TAG" --notes "$notes"
          else
            if [ "$RUNTIME_CHANNEL" = dev ]; then
              gh release create "$RUNTIME_TAG" --draft --prerelease --target "$RUNTIME_SHA" --title "$RUNTIME_TAG" --notes "$notes"
            else
              gh release create "$RUNTIME_TAG" --draft --target "$RUNTIME_SHA" --title "$RUNTIME_TAG" --notes "$notes"
            fi
          fi
          gh release upload "$RUNTIME_TAG" release-assets/* --clobber
      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RUNTIME_TAG" --json assets --jq '.assets | length')"
          test "$count" -eq 21 || { echo "::error::Draft release holds $count assets, expected 21"; exit 1; }
          gh release edit "$RUNTIME_TAG" --draft=false
          echo "Published $RUNTIME_TAG with 21 assets"
