name: Runtime musl Granite benchmark
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Non-publishing Runtime candidate build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  granite:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download the exact x64 musl candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_RUN" = 44981728406
          for attempt in $(seq 1 120); do
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts" --jq '.artifacts[].name')
            if grep -qx runtime-release-x86_64-unknown-linux-musl <<<"$artifacts"; then
              break
            fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .status)
            if test "$status" = completed; then
              echo 'Candidate run ended before the musl archive was uploaded' >&2
              exit 1
            fi
            sleep 15
          done
          gh run download "$CANDIDATE_RUN" -n runtime-release-x86_64-unknown-linux-musl -D candidate
          metadata=candidate/runtime-build-x86_64-unknown-linux-musl.json
          test "$(jq -r .source_commit "$metadata")" = 4bb37fdd364691d8dcea9652d8fcb94ddf16f174
          test "$(jq -r .target_triple "$metadata")" = x86_64-unknown-linux-musl
          tarball=rsrs-runtime-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "$(jq -r .archive_sha256 "$metadata")" "candidate/$tarball" | sha256sum -c -
          mkdir candidate/payload
          tar -xzf "candidate/$tarball" -C candidate/payload
          executable="candidate/payload/$(jq -r .binary_file "$metadata")"
          printf '%s  %s\n' "$(jq -r .binary_sha256 "$metadata")" "$executable" | sha256sum -c -
          readelf -l "$executable" > candidate/program-headers.txt
          readelf -d "$executable" > candidate/dynamic-section.txt
          ! grep -q INTERP candidate/program-headers.txt
          ! grep -q NEEDED candidate/dynamic-section.txt
      - name: Fetch pinned IBM Granite assets
        run: |
          set -euo pipefail
          base=https://huggingface.co/ibm-granite/granite-embedding-311m-multilingual-r2/resolve/44399559930365213510b1ee2eb15ded83374f0e
          curl -fsSL --retry 2 "$base/onnx/model_quint8_avx2.onnx" -o candidate/granite.onnx
          curl -fsSL --retry 2 "$base/tokenizer.json" -o candidate/tokenizer.json
          sha256sum -c <<'HASHES'
          f1fdd44e7e1ac51f12ab7957c7bd092e064d596c288513bf9d326842f669edee  candidate/granite.onnx
          0087c868b33bad550a78a08d19798cfd7f713cde4f020803b8f51f405503e15f  candidate/tokenizer.json
          HASHES
      - name: Run both model switches in Alpine
        run: |
          set -euo pipefail
          mkdir benchmark-report
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24-alpine \
            node scripts/granite-musl-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite-musl-benchmark
          path: |
            benchmark-report/
            candidate/runtime-build-x86_64-unknown-linux-musl.json
            candidate/program-headers.txt
            candidate/dynamic-section.txt
          if-no-files-found: warn
