name: Prepare reviewed private SDK dependencies

# Populates the Actions cache holding the exact pinned closed-source Core SDK
# bytes for all pinned targets. Reads BOTH SDK locks from a reviewed
# main commit of this repository (sdk/core-sdk.lock.json and
# crates/core-sdk/core-sdk.lock.json); the plan refuses when the copies differ.
# The credential-bearing download job runs only on trusted main dispatches;
# Archive and manifest validation remain mandatory; platform builds run in release.yml.
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact independently reviewed runtime commit containing both private SDK locks
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    cache-mode: none
    if: github.repository == 'risense-ai/respire-runtime' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Read source-controlled lock JSON as data only
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
        run: |
          set -euo pipefail
          [[ "$SDK_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          mkdir "$RUNNER_TEMP/sdk-locks"
          gh api "repos/risense-ai/respire-runtime/contents/sdk/core-sdk.lock.json?ref=$SDK_SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/sdk-locks/root.json"
          gh api "repos/risense-ai/respire-runtime/contents/crates/core-sdk/core-sdk.lock.json?ref=$SDK_SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/sdk-locks/crate.json"
          node scripts/sdk-ci-cache.mjs plan "$RUNNER_TEMP/sdk-locks/root.json" "$RUNNER_TEMP/sdk-locks/crate.json" > "$RUNNER_TEMP/sdk-locks/plan.json"
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const matrix=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/sdk-locks/plan.json'));
          appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(matrix)}\n`);
          JS
  download:
    cache-mode: write-only
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Credential-bearing code is always the workflow's reviewed main commit.
      # Never checkout/execute the selected source revision in this job.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare and audit exact SDK bytes using trusted main tools
        env:
          CORE_SDK_READ_TOKEN: ${{ secrets.CORE_SDK_READ_TOKEN }}
          SDK_TARGET: ${{ matrix.target }}
          SDK_ENTRY_JSON: ${{ toJSON(matrix.entry) }}
        run: node scripts/sdk-ci-cache.mjs prepare "$SDK_TARGET" "$SDK_ENTRY_JSON"
      - uses: actions/cache/save@v4
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ matrix.key }}
          enableCrossOsArchive: true
      - uses: actions/cache/save@v4
        with:
          path: .sdk-archives/${{ matrix.target }}
          key: ${{ matrix.archive_key }}
          enableCrossOsArchive: true
