name: Verify and publish protocol crate

# Publishes crates/protocol (respire-protocol) to crates.io. The RPC contract
# of this repository and respire-cli is owned here; the SDK binding crate
# publication stays owned by respire-core. Requires the CARGO_REGISTRY_TOKEN
# repository secret (read only by the explicit publish step).
on:
  push:
    tags: ['v*', '!v*-*']
  workflow_dispatch:
    inputs:
      package:
        description: Protocol publication only; SDK publication is owned by respire-core
        type: choice
        default: protocol
        options: [protocol]
      publish:
        description: Publish verified new crate versions to crates.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: interface-crates
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate stable release tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = /^version\s*=\s*"([^"]+)"/m.exec(fs.readFileSync('runtime/Cargo.toml', 'utf8'))?.[1];
          if (process.env.GITHUB_EVENT_NAME === 'push' && (!/^\d+\.\d+\.\d+$/.test(version || '') || process.env.GITHUB_REF !== `refs/tags/v${version}`)) {
            throw new Error('Stable release tag must exactly match the runtime source version');
          }
          NODE
  protocol:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Require the migrated protocol crate (phase P2 gate)
        run: |
          test -f crates/protocol/Cargo.toml || {
            echo "::error::crates/protocol has not been migrated yet (phase P2 subtree migration)."
            exit 1
          }
      - name: Verify protocol package
        run: node scripts/verify-interface-crate.mjs protocol "$RUNNER_TEMP/protocol-package"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: protocol-package-verification
          path: |
            ${{ runner.temp }}/protocol-package/PACKAGE.json
            ${{ runner.temp }}/protocol-package/target/package/*.crate
          if-no-files-found: error
      - name: Publish protocol only when explicitly selected
        if: github.event_name == 'push' || (inputs.publish && inputs.package == 'protocol')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/protocol-package/target
        run: node scripts/publish-interface-crate.mjs protocol
