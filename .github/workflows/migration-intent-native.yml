name: Native Windows migration journal

on:
  pull_request:
    paths:
      - 'crates/app/src/migration*.rs'
      - 'crates/app/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/migration-intent-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-intent-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUNTIME_TARGET: x86_64-pc-windows-msvc
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve exact existing SDK cache
        id: sdk
        run: echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .sdk/${{ env.RUNTIME_TARGET }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Reverify SDK without private download credentials
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -z "${CORE_SDK_READ_TOKEN:-}"
          node scripts/fetch-core-sdk.mjs "$RUNTIME_TARGET"
      - name: Exercise real HKCU fence and journal failure models
        run: |
          cargo test --locked -p respire_app migration::intent:: -- --test-threads=1
      # Supplemental source-level native evidence only. This does not replace
      # process-interruption, installer, SDK, G1 or four-package regression gates.
