name: Freeze unpublished G1 combination inputs

on:
  workflow_dispatch:
    inputs:
      cli_source_sha:
        description: Reviewed immutable CLI source SHA; each consumer uses its own pinned SDK
        type: string
        required: true

# Same existing read scope as Runtime CI. No private SDK/release credential.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=-crt-static
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: -C target-feature=-crt-static
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
      FREEZE_CLI_SHA: ${{ inputs.cli_source_sha }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable source selection
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch('[a-f0-9]{40}', os.environ['FREEZE_CLI_SHA'])
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          PY
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-cli
          ref: ${{ inputs.cli_source_sha }}
          path: .cli-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify freeze identities and workflow boundaries without products
        if: runner.os == 'Linux'
        run: node --test scripts/test-freeze-runtime-g1-candidate.mjs
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Require native platform hardware
        run: |
          bash scripts/require-native-linux-arm64.sh "$RUNTIME_TARGET"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const target = process.env.RUNTIME_TARGET;
          assert.equal(process.platform, target.includes('windows') ? 'win32' : target.includes('apple') ? 'darwin' : 'linux');
          assert.equal(process.arch, target.startsWith('aarch64') ? 'arm64' : 'x64');
          assert.equal(process.env.RUNNER_ARCH, process.arch === 'arm64' ? 'ARM64' : 'X64');
          NODE
      - name: Require native Intel Mac hardware
        if: matrix.target == 'x86_64-apple-darwin'
        run: node scripts/smoke-runtime-release.mjs --check-native-intel
      - name: Require native Windows ARM64 hardware
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64' -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'Windows ARM64 freeze requires native ARM64 hardware'
          }
      - name: Require each consumer's matching locks and resolve its exact SDK caches
        id: sdk
        run: |
          set -euo pipefail
          cmp sdk/core-sdk.lock.json crates/core-sdk/core-sdk.lock.json
          cmp .cli-source/sdk/core-sdk.lock.json .cli-source/crates/core-sdk/core-sdk.lock.json
          echo "payload=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
          echo "archive=$(node scripts/sdk-ci-cache.mjs archive-key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
          echo "cli_payload=$(cd .cli-source && node ../scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
          echo "cli_archive=$(cd .cli-source && node ../scripts/sdk-ci-cache.mjs archive-key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      # Restore at the producer's paths to retain the existing cache version, then move to its owner.
      - uses: actions/cache/restore@v4
        id: cli-payload
        with:
          path: .sdk/${{ env.RUNTIME_TARGET }}
          key: ${{ steps.sdk.outputs.cli_payload }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: cli-archive
        with:
          path: .sdk-archives/${{ env.RUNTIME_TARGET }}
          key: ${{ steps.sdk.outputs.cli_archive }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Isolate and audit the CLI's own original SDK bytes
        env:
          EXPECTED_PAYLOAD: ${{ steps.sdk.outputs.cli_payload }}
          MATCHED_PAYLOAD: ${{ steps.cli-payload.outputs.cache-matched-key }}
          EXPECTED_ARCHIVE: ${{ steps.sdk.outputs.cli_archive }}
          MATCHED_ARCHIVE: ${{ steps.cli-archive.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PAYLOAD" && test "$EXPECTED_PAYLOAD" = "$MATCHED_PAYLOAD"
          test -n "$EXPECTED_ARCHIVE" && test "$EXPECTED_ARCHIVE" = "$MATCHED_ARCHIVE"
          test -z "${CORE_SDK_READ_TOKEN:-}" && test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          mkdir -p .cli-source/.sdk .cli-source/.sdk-archives
          test ! -e ".cli-source/.sdk/$RUNTIME_TARGET" && test ! -e ".cli-source/.sdk-archives/$RUNTIME_TARGET"
          mv ".sdk/$RUNTIME_TARGET" ".cli-source/.sdk/$RUNTIME_TARGET"
          mv ".sdk-archives/$RUNTIME_TARGET" ".cli-source/.sdk-archives/$RUNTIME_TARGET"
          (cd .cli-source && node ../scripts/sdk-ci-cache.mjs observe "$RUNTIME_TARGET")
      - uses: actions/cache/restore@v4
        id: payload
        with:
          path: .sdk/${{ env.RUNTIME_TARGET }}
          key: ${{ steps.sdk.outputs.payload }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: .sdk-archives/${{ env.RUNTIME_TARGET }}
          key: ${{ steps.sdk.outputs.archive }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Audit existing original SDK bytes without downloading or saving caches
        env:
          EXPECTED_PAYLOAD: ${{ steps.sdk.outputs.payload }}
          MATCHED_PAYLOAD: ${{ steps.payload.outputs.cache-matched-key }}
          EXPECTED_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          MATCHED_ARCHIVE: ${{ steps.archive.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PAYLOAD" && test "$EXPECTED_PAYLOAD" = "$MATCHED_PAYLOAD"
          test -n "$EXPECTED_ARCHIVE" && test "$EXPECTED_ARCHIVE" = "$MATCHED_ARCHIVE"
          test -z "${CORE_SDK_READ_TOKEN:-}" && test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          node scripts/sdk-ci-cache.mjs observe "$RUNTIME_TARGET"
      # Alpine candidate builds retain their existing container path; this cache is native-host only.
      - name: Resolve Runtime native dependency identity
        if: ${{ !endsWith(matrix.target, '-musl') }}
        id: rust-runtime
        env:
          RUST_CI_FEATURES: default
        run: node scripts/rust-ci-cache.mjs key native "$RUNTIME_TARGET"
      - name: Resolve CLI native dependency identity independently
        if: ${{ !endsWith(matrix.target, '-musl') }}
        id: rust-cli
        working-directory: .cli-source
        env:
          RUST_CI_FEATURES: default
        run: node ../scripts/rust-ci-cache.mjs key native "$RUNTIME_TARGET"
      - uses: actions/cache/restore@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        id: rust-runtime-restore
        with:
          path: .rust-native-cache
          key: ${{ steps.rust-runtime.outputs.key }}
      - uses: actions/cache/restore@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        id: rust-cli-restore
        with:
          path: .cli-source/.rust-native-cache
          key: ${{ steps.rust-cli.outputs.key }}
      - name: Restore each consumer's third-party compilation only
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: |
          set -euo pipefail
          node scripts/rust-ci-cache.mjs restore native "$RUNTIME_TARGET"
          (cd .cli-source && node ../scripts/rust-ci-cache.mjs restore native "$RUNTIME_TARGET")
      - name: Build the exact two checked-out consumers without credentials
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}" && test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          export RSRS_CORE_SDK_DIR="$PWD/.sdk/$RUNTIME_TARGET"
          if [[ "$RUNTIME_TARGET" == *-musl ]]; then
            bash scripts/build-linux-musl.sh "$RUNTIME_TARGET" candidate
            (cd .cli-source && RSRS_CORE_SDK_DIR="$PWD/.sdk/$RUNTIME_TARGET" bash scripts/build-linux-musl.sh "$RUNTIME_TARGET" candidate)
          else
            cargo build --locked -p respire_runtime --bin rsrs-runtime --target "$RUNTIME_TARGET"
            RSRS_CORE_SDK_DIR="$PWD/.cli-source/.sdk/$RUNTIME_TARGET" cargo build --locked --manifest-path .cli-source/Cargo.toml -p respire --target "$RUNTIME_TARGET" --target-dir .cli-source/target
          fi
      - name: Authenticate the exact paired Linux desktop CI artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile
          repository = 'repos/risense-ai/respire-client2'
          source = '6ffa187685734873721ab51f3a54d8b2c29cd269'
          run_id, artifact_id = 43721147038, 14163499760
          artifact_sha256 = '307d235c76c90272c4f8d1dcb4382910b40e58a16399494da82fb6802e053934'
          archive_sha256 = '4a294a7de11fdaea48e534539bbfb5693c30a90e05544aea9aff344414a3c925'
          binary_sha256 = '4a62424ecffad8f732f5484495e1a6a5f7c6649ea7fb1809bc1b51a049f48677'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', repository + path], timeout=60))
          run = api(f'/actions/runs/{run_id}')
          assert run['head_sha'] == source and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'pull_request' and run['path'] == '.github/workflows/desktop.yml'
          assert run['workflow_id'] == 400250394 and run['run_attempt'] == 1 and run['run_number'] == 263
          artifact = api(f'/actions/artifacts/{artifact_id}')
          assert artifact['id'] == artifact_id and artifact['name'] == 'respire-linux-amd64' and not artifact['expired']
          assert artifact['workflow_run']['id'] == run_id and artifact['workflow_run']['head_sha'] == source
          assert artifact['size_in_bytes'] == 11583325 and artifact['digest'] == 'sha256:' + artifact_sha256
          raw = subprocess.check_output(['gh', 'api', repository + f'/actions/artifacts/{artifact_id}/zip'], timeout=120)
          assert len(raw) == artifact['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == artifact_sha256
          import zipfile
          with zipfile.ZipFile(io.BytesIO(raw)) as bundle:
              members = bundle.infolist()
              assert len(members) == 4 and {item.filename for item in members} == {'LICENSE.txt', 'SHA256SUMS', 'THIRD_PARTY_NOTICES.txt', 'respire-linux-amd64.tar.gz'}
              assert all(not item.is_dir() and not item.flag_bits & 1 and item.file_size <= 32 * 1024 * 1024 for item in members)
              payload = bundle.read('respire-linux-amd64.tar.gz')
          assert len(payload) == 11583919 and hashlib.sha256(payload).hexdigest() == archive_sha256
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              member, = archive.getmembers()
              assert member.name == 'respire' and member.type == tarfile.REGTYPE and not member.pax_headers and member.size == 19183600
              with archive.extractfile(member) as stream:
                  binary = stream.read(member.size + 1)
          assert len(binary) == 19183600 and hashlib.sha256(binary).hexdigest() == binary_sha256
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'legacy-desktop'
          output.mkdir(mode=0o700)
          executable = output / 'respire'
          with executable.open('xb') as stream:
              stream.write(binary)
          executable.chmod(0o700)
          (output / 'respire-linux-amd64.tar.gz').write_bytes(payload)
          proof = dict(source_commit=source, release='host-owned-candidate', version='0.2.56-dev.263',
                       repository='risense-ai/respire-client2', workflow=run['path'], run_id=run_id, run_attempt=1,
                       artifact_id=artifact_id, artifact_sha256=artifact_sha256,
                       archive_sha256=archive_sha256, binary_sha256=binary_sha256)
          (output / 'desktop-source.json').write_text(json.dumps(proof) + '\n')
          PY
      - name: Package original source-fixture bytes before freezing
        run: node scripts/freeze-runtime-g1-candidate.mjs package
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: g1-freeze-part-${{ env.RUNTIME_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: freeze-part/
          if-no-files-found: error
          retention-days: 1
      - name: Remove Runtime workspace products after packaging
        if: success() && !endsWith(matrix.target, '-musl') && steps.rust-runtime-restore.outputs.cache-hit != 'true'
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/${{ matrix.target }}
        run: node scripts/rust-ci-cache.mjs pack native "$RUNTIME_TARGET"
      - uses: actions/cache/save@v4
        if: success() && !endsWith(matrix.target, '-musl') && steps.rust-runtime-restore.outputs.cache-hit != 'true'
        with:
          path: .rust-native-cache
          key: ${{ steps.rust-runtime.outputs.key }}
      - name: Remove CLI workspace products after packaging
        if: success() && !endsWith(matrix.target, '-musl') && steps.rust-cli-restore.outputs.cache-hit != 'true'
        working-directory: .cli-source
        env:
          RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.cli-source/.sdk/${{ matrix.target }}
        run: node ../scripts/rust-ci-cache.mjs pack native "$RUNTIME_TARGET"
      - uses: actions/cache/save@v4
        if: success() && !endsWith(matrix.target, '-musl') && steps.rust-cli-restore.outputs.cache-hit != 'true'
        with:
          path: .cli-source/.rust-native-cache
          key: ${{ steps.rust-cli.outputs.key }}

  freeze:
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FREEZE_CLI_SHA: ${{ inputs.cli_source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate all native upload outputs in this exact run and attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, stat, subprocess, zipfile
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/risense-ai/respire-runtime' + path]))
          run = api('/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          assert run['head_sha'] == os.environ['GITHUB_SHA'] and run['event'] == 'workflow_dispatch'
          assert run['path'] == '.github/workflows/freeze-g1-candidate.yml'
          assert str(run['run_attempt']) == os.environ['GITHUB_RUN_ATTEMPT']
          targets = json.loads(subprocess.check_output(['node', '--input-type=module', '-e',
              "import {FREEZE_TARGETS} from './scripts/freeze-runtime-g1-candidate.mjs'; console.log(JSON.stringify(FREEZE_TARGETS));"]))
          uploaded = api(f"/actions/runs/{run['id']}/artifacts?per_page=100")['artifacts']
          artifacts = []
          for target in targets:
              expected_artifact_name = f"g1-freeze-part-{target}-{run['id']}-{run['run_attempt']}"
              matches = [item for item in uploaded if item['name'] == expected_artifact_name]
              assert len(matches) == 1
              artifact = api('/actions/artifacts/' + str(matches[0]['id']))
              assert not artifact['expired'] and artifact['name'] == expected_artifact_name
              assert re.fullmatch('sha256:[a-f0-9]{64}', artifact['digest'])
              expected_digest = artifact['digest'].removeprefix('sha256:')
              assert artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == run['head_sha']
              assert 0 < artifact['size_in_bytes'] <= 512 * 1024 * 1024
              raw = subprocess.check_output(['gh', 'api', 'repos/risense-ai/respire-runtime/actions/artifacts/' + str(artifact['id']) + '/zip'])
              assert len(raw) == artifact['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == expected_digest
              destination = pathlib.Path('freeze-parts') / target
              destination.mkdir(parents=True)
              with zipfile.ZipFile(io.BytesIO(raw)) as bundle:
                  members = bundle.infolist()
                  assert 0 < len(members) <= 512
                  total = 0
                  names = set()
                  for member in members:
                      member_name = member.filename
                      assert member_name and not member.is_dir() and not member_name.startswith('/')
                      assert not any(value in member_name for value in ['\\', ':', '\0'])
                      assert all(part and part not in ('.', '..') for part in member_name.split('/'))
                      assert member_name not in names
                      names.add(member_name)
                      assert stat.S_IFMT(member.external_attr >> 16) in (0, stat.S_IFREG)
                      assert not member.flag_bits & 1
                      assert 0 <= member.file_size <= 256 * 1024 * 1024
                      total += member.file_size
                      assert total <= 1024 * 1024 * 1024
                      output = destination / member_name
                      output.parent.mkdir(parents=True, exist_ok=True)
                      data = bundle.read(member)
                      assert len(data) == member.file_size
                      with output.open('xb') as stream:
                          stream.write(data)
              artifacts.append(dict(target=target, id=artifact['id'], name=expected_artifact_name, digest=artifact['digest']))
          origin = dict(repository='risense-ai/respire-runtime', source_sha=run['head_sha'],
                        workflow=run['path'], run_id=str(run['id']), run_attempt=str(run['run_attempt']), artifacts=artifacts)
          pathlib.Path('freeze-origin.json').write_text(json.dumps(origin) + '\n')
          PY
      - name: Freeze exact bytes; this does not evaluate G1
        id: candidate
        run: node scripts/freeze-runtime-g1-candidate.mjs assemble
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: g1-frozen-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-input/
          if-no-files-found: error
          retention-days: 1
      - name: Record input identity without claiming acceptance
        env:
          INPUT_ID: ${{ steps.upload.outputs.artifact-id }}
          INPUT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          printf 'Runtime source: %s\nCLI source: %s\nFreeze run/attempt: %s/%s\nFrozen input artifact: %s\nArtifact SHA-256: %s\nCandidate SHA-256: %s\nG1: not evaluated\n' "$GITHUB_SHA" "$FREEZE_CLI_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$INPUT_ID" "$INPUT_DIGEST" "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
