name: Runtime CI

# PR and push runs check current Runtime source and contracts.
# Native products and full data-safety suites are accepted after publication.
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace_present: ${{ steps.detect.outputs.workspace_present }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: detect
        run: |
          set -euo pipefail
          for path in runtime/Cargo.toml crates/protocol/tests contracts/runtime-control/manifest.json; do
            test -e "$path" || { echo "::error::Missing required workspace input: $path"; exit 1; }
          done
          echo "workspace_present=true" >> "$GITHUB_OUTPUT"

  control-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the frozen Runtime control fixtures
        run: node scripts/verify-runtime-control-contract.mjs
      - name: Verify approved SDK version trains and download boundaries
        run: node --test scripts/test-sdk-version-trains.mjs
      - name: Check native release smoke response assertions
        run: node scripts/smoke-runtime-release.mjs --self-check
      - name: Reject invalid MCP execution evidence
        run: node --test scripts/test-runtime-mcp-probe.mjs
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Run the Rust contract consumer tests
        run: cargo test -p respire_protocol --locked

  workspace-tests:
    # Keep the existing required job name; this is a source check, not native acceptance.
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the exact SDK dependency identity
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          cmp sdk/core-sdk.lock.json crates/core-sdk/core-sdk.lock.json
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$target")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk-restore
        with:
          path: .sdk/${{ steps.sdk.outputs.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify SDK bytes without private credentials
        shell: bash
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.sdk-restore.outputs.cache-matched-key }}
          SDK_TARGET: ${{ steps.sdk.outputs.target }}
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}"
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          node scripts/fetch-core-sdk.mjs "$SDK_TARGET"
      - name: Check current Runtime libraries and binaries
        run: cargo check --workspace --lib --bins --locked
      - name: Detect affected authentication unit tests
        id: auth-tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD^ HEAD -- .github/workflows/ci.yml runtime/src/startup_identity.rs runtime/src/snapshot_authority.rs runtime/src/maintenance_control.rs crates/app/src/login_transaction.rs crates/app/src/login_transaction crates/app-domain/src/auth.rs crates/app-domain/src/credential_io.rs crates/app-domain/src/keystore.rs | grep -q .; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run affected authentication recovery unit tests
        if: steps.auth-tests.outputs.required == 'true'
        run: |
          cargo test --locked -p respire_app_domain --lib keystore::host_tests::imported_read_preserves_missing_credential_type -- --exact
          cargo test --locked -p respire_app --lib login_transaction::tests:: -- --test-threads=1
          cargo test --locked -p respire_runtime --bin rsrs-runtime startup_identity::tests:: -- --test-threads=1
          cargo test --locked -p respire_runtime --bin rsrs-runtime snapshot_authority::tests:: -- --test-threads=1
      - name: Run affected legacy database migration unit tests
        env:
          RSRS_CORE_TEST_MODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD^ HEAD -- .github/workflows/ci.yml crates/app/src/migration.rs crates/app/src/migration_intent.rs crates/app/src/migration_material.rs crates/app/src/migration_readiness_tests.rs runtime/src/migration_control.rs | grep -q .; then
            cargo test --locked -p respire_app --lib migration:: -- --test-threads=1
          else
            echo 'Legacy migration unit tests are not affected by this change.'
          fi
      - name: Run affected RPC admission unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD^ HEAD -- .github/workflows/ci.yml crates/commands/src/rpc_serve.rs | grep -q .; then
            cargo test --locked -p respire_commands --lib rpc_serve::tests:: -- --test-threads=1
          else
            echo 'RPC admission unit tests are not affected by this change.'
          fi
      - name: Run affected core asset unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD^ HEAD -- .github/workflows/ci.yml crates/commands/src/model_assets.rs | grep -q .; then
            cargo test --locked -p respire_commands --lib model_assets::tests:: -- --test-threads=1
          else
            echo 'Core asset unit tests are not affected by this change.'
          fi

  ci-complete:
    if: always()
    needs: [control-contract, detect, workspace-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every source check to succeed
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          WORKSPACE_PRESENT: ${{ needs.detect.outputs.workspace_present }}
          CHECK_RESULT: ${{ needs.workspace-tests.result }}
          CONTRACT_RESULT: ${{ needs.control-contract.result }}
        run: |
          test "$DETECT_RESULT" = success || { echo "::error::Workspace detection did not pass"; exit 1; }
          test "$WORKSPACE_PRESENT" = true || { echo "::error::Required workspace is missing"; exit 1; }
          test "$CONTRACT_RESULT" = success || { echo "::error::Runtime control contract did not pass"; exit 1; }
          test "$CHECK_RESULT" = success || { echo "::error::Runtime source check did not pass"; exit 1; }
          echo 'Source checks passed. Native and data-safety acceptance run only after publication.' >> "$GITHUB_STEP_SUMMARY"
