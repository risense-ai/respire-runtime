name: Runtime CI

# Source tests are mandatory on PR, push, and manual runs.
# Native artifact acceptance is a separate gate.
on:
  workflow_dispatch:
    inputs:
      source_checks_only:
        description: Compatibility input; mandatory source tests always run
        type: boolean
        default: true
      required_candidate_run_id:
        description: Existing same-source Runtime run containing the reviewed frozen native input artifact
        type: string
      required_candidate_artifact_id:
        description: Exact same-repository artifact containing candidate.json and release-assets for both native targets
        type: string
      required_candidate_sha256:
        description: SHA-256 of the exact frozen candidate.json bytes; never enables a source-check exemption
        type: string
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace_present: ${{ steps.detect.outputs.workspace_present }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: detect
        run: |
          set -euo pipefail
          for path in runtime/Cargo.toml crates/protocol/tests contracts/runtime-control/manifest.json scripts/required-tests.json; do
            test -e "$path" || { echo "::error::Missing required workspace input: $path"; exit 1; }
          done
          echo "workspace_present=true" >> "$GITHUB_OUTPUT"

  control-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the frozen Runtime control fixtures
        run: node scripts/verify-runtime-control-contract.mjs
      - name: Reject invalid required-gate evidence
        run: node scripts/test-required-tests.mjs
      - name: Reject mixed native producer assembly inputs without running products
        run: node scripts/test-produce-runtime-g1-smoke.mjs
      - name: Reject mixed business execution inputs and original archive payloads
        run: |
          node scripts/test-produce-runtime-g1-business.mjs
          python3 -B scripts/test-verify-business-archive-payloads.py
          node scripts/test-runtime-g1-mappings.mjs
      - name: Verify approved SDK version trains and download boundaries
        run: node --test scripts/test-sdk-version-trains.mjs
      - name: Check native release smoke response assertions
        run: node scripts/smoke-runtime-release.mjs --self-check
      - name: Reject invalid MCP execution evidence
        run: node --test scripts/test-runtime-mcp-probe.mjs
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Run the Rust contract consumer tests
        run: cargo test -p respire_protocol --locked

  workspace-tests:
    # cargo test source matrix (Linux GNU host target). Extends after P2 with
    # the migrated coverage groups (runtime smoke, autostart supervision).
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RSRS_ENGINE: cpu
      # Several existing tests change process-global data-dir/language variables
      # and create their own concurrent client threads.
      RSRS_CORE_TEST_MODE: '1'
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
      # Keep backtrace file:line, assertions and overflow checks; omit full
      # type/variable DWARF only. These source tests remain unoptimized.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the pinned SDK dependency cache
        id: sdk-cache
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$target")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk-cache-restore
        if: steps.sdk-cache.outputs.key != ''
        with:
          path: .sdk/${{ steps.sdk-cache.outputs.target }}
          key: ${{ steps.sdk-cache.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require the exact SDK cache match
        if: steps.sdk-cache.outputs.key != ''
        shell: bash
        env:
          EXPECTED_KEY: ${{ steps.sdk-cache.outputs.key }}
          MATCHED_KEY: ${{ steps.sdk-cache-restore.outputs.cache-matched-key }}
        run: test -n "$EXPECTED_KEY" && test "$MATCHED_KEY" = "$EXPECTED_KEY"
      - name: Prepare pinned binary Core SDK
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -Vv | sed -n 's/^host: //p')"
          node scripts/fetch-core-sdk.mjs "$target"
      - name: Prepare official pinned standalone Runtime for lifecycle tests
        id: official-runtime-fixture
        shell: bash
        env:
          EXPECTED_RUNTIME_PRODUCT_SOURCE_SHA: 9338a6654cf395525668dd9faaea3f401abe2d5a
          RUNTIME_FIXTURE_HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          cargo build --locked -p respire_host_frontend --example host-fixture-cli
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, mkdtempSync, readFileSync, realpathSync, statSync} from 'node:fs';
          import {join, resolve} from 'node:path';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          assert.equal(process.env.RUNTIME_FIXTURE_HOSTED, 'true', 'Runtime fixtures require a dedicated GitHub-hosted runner');
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'official-runtime-'));
          const cli = resolve('target/debug/examples/host-fixture-cli');
          const env = {...process.env, RSRS_DATA_DIR: root};
          // Keep the test environment intact; only the official installer may download.
          delete env.RSRS_CORE_TEST_MODE;
          const result = spawnSync(cli, ['--json', 'runtime', 'install'], {env, stdio: 'inherit'});
          if (result.error) throw result.error;
          assert.equal(result.status, 0, 'Official pinned Runtime installation failed');
          const pin = JSON.parse(readFileSync('host-frontend/runtime-pin.json', 'utf8'));
          const runtime = join(root, 'runtime', pin.required, 'rsrs-runtime');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const selected = JSON.parse(readFileSync(join(root, 'runtime.json'), 'utf8'));
          assert.equal(selected.version, pin.required);
          assert.ok(selected.release?.metadata_json, 'Official Runtime receipt is required');
          assert.equal(hash(selected.release.metadata_json), selected.release.metadata_sha256);
          const metadata = JSON.parse(selected.release.metadata_json);
          assert.equal(metadata.schema_version, 2);
          assert.equal(metadata.runtime_version, pin.required);
          assert.match(process.env.EXPECTED_RUNTIME_PRODUCT_SOURCE_SHA, /^[a-f0-9]{40}$/);
          assert.equal(metadata.source_commit, process.env.EXPECTED_RUNTIME_PRODUCT_SOURCE_SHA);
          assert.equal(metadata.binary_sha256, selected.sha256);
          assert.equal(hash(readFileSync(runtime)), selected.sha256);
          assert.ok(statSync(runtime).isFile());
          assert.notEqual(realpathSync(runtime), realpathSync(cli), 'CLI cannot be the Runtime fixture');
          appendFileSync(process.env.GITHUB_ENV, `RSRS_RUNTIME_BIN=${runtime}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `root=${root}\n`);
          NODE
      - name: Run the workspace source tests
        id: source-tests
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/runtime-source-config
          XDG_DATA_HOME: ${{ runner.temp }}/runtime-source-data
          XDG_CACHE_HOME: ${{ runner.temp }}/runtime-source-cache
          APPDATA: ${{ runner.temp }}/runtime-source-appdata
          LOCALAPPDATA: ${{ runner.temp }}/runtime-source-local
          RSRS_DATA_DIR: ${{ runner.temp }}/runtime-source-state
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HOME="$RUNNER_TEMP/runtime-source-home"
          export USERPROFILE="$HOME"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$APPDATA" "$LOCALAPPDATA" "$RSRS_DATA_DIR"
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {closeSync, mkdirSync, openSync, readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {join} from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'required-tests-raw-runtime-workspace');
          mkdirSync(directory);
          const command = ['cargo', 'test', '--workspace', '--locked']; // cargo test --workspace --locked
          const started_at = new Date().toISOString();
          const stdout = openSync(join(directory, 'stdout.log'), 'wx'), stderr = openSync(join(directory, 'stderr.log'), 'wx');
          let result;
          try { result = spawnSync(command[0], command.slice(1), {stdio: ['inherit', stdout, stderr]}); }
          finally { closeSync(stdout); closeSync(stderr); }
          const out = readFileSync(join(directory, 'stdout.log')), err = readFileSync(join(directory, 'stderr.log'));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          writeFileSync(join(directory, 'execution.json'), JSON.stringify({
            schema: 1, evidence_class: 'source-raw', gate: 'not-evaluated', candidate_sha256: null,
            repository: process.env.GITHUB_REPOSITORY, source_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            job: process.env.GITHUB_JOB, runner_os: process.env.RUNNER_OS, runner_arch: process.env.RUNNER_ARCH,
            command, started_at, completed_at: new Date().toISOString(),
            exit_code: result.status, signal: result.signal ?? null, error: result.error?.message ?? null,
            stdout_sha256: hash(out), stderr_sha256: hash(err)
          }, null, 2) + '\n', {flag: 'wx'});
          process.stdout.write(out); process.stderr.write(err);
          process.exit(result.status ?? 1);
          NODE
      - name: Compile cross-repository CLI integration fixtures (not execution)
        run: cargo test --locked -p respire_commands --example cli_business_tests --no-run
      - name: Preserve workspace source test output
        if: ${{ always() && !cancelled() && (steps.source-tests.outcome == 'success' || steps.source-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: required-tests-raw-runtime-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-tests-raw-runtime-workspace
          retention-days: 7
          if-no-files-found: error

  g1-native-smoke:
    # Absence of inputs does not exempt the unconditional required-tests gate below.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.required_candidate_run_id != '' || inputs.required_candidate_artifact_id != '' || inputs.required_candidate_sha256 != '') }}
    name: g1-native-smoke (${{ matrix.target }})
    needs: [control-contract, detect]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
      G1_NATIVE_PLATFORM: ${{ matrix.platform }}
      G1_NATIVE_ARCH: ${{ matrix.arch }}
      G1_CANDIDATE_SHA256: ${{ inputs.required_candidate_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate the exact frozen input artifact without private SDK credentials
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.required_candidate_run_id }}
          INPUT_ARTIFACT: ${{ inputs.required_candidate_artifact_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          for (const key of ['INPUT_RUN', 'INPUT_ARTIFACT']) assert.match(process.env[key] ?? '', /^[1-9][0-9]*$/);
          assert.match(process.env.G1_CANDIDATE_SHA256 ?? '', /^[a-f0-9]{64}$/);
          const base = `repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const api = path => JSON.parse(execFileSync('gh', ['api', `${base}/${path}`], {encoding: 'utf8'}));
          const run = api(`runs/${process.env.INPUT_RUN}`);
          const artifact = api(`artifacts/${process.env.INPUT_ARTIFACT}`);
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.head_sha, process.env.GITHUB_SHA);
          assert.equal(artifact.workflow_run.id, Number(process.env.INPUT_RUN));
          assert.equal(artifact.workflow_run.head_sha, process.env.GITHUB_SHA);
          assert.equal(artifact.expired, false);
          assert.ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 256 * 1024 * 1024);
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.required_candidate_artifact_id }}
          run-id: ${{ inputs.required_candidate_run_id }}
          github-token: ${{ github.token }}
          path: g1-input
      - name: Resolve the independent exact compressed SDK cache key
        id: sdk
        run: |
          echo "archive_key=$(node scripts/sdk-ci-cache.mjs archive-key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: payload
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: .sdk-archives/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.archive_key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Execute the original native smoke against frozen bytes
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.archive_key }}
          MATCHED_KEY: ${{ steps.archive.outputs.cache-matched-key }}
          EXPECTED_PAYLOAD_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_PAYLOAD_KEY: ${{ steps.payload.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}"
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -n "$EXPECTED_PAYLOAD_KEY" && test "$EXPECTED_PAYLOAD_KEY" = "$MATCHED_PAYLOAD_KEY"
          test ! -e release-assets
          mv g1-input/release-assets release-assets
          node scripts/produce-runtime-g1-smoke.mjs run
      - name: Upload this attempt's original native execution evidence
        id: raw
        uses: actions/upload-artifact@v4
        with:
          name: required-tests-raw-runtime-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-raw
          if-no-files-found: error
          retention-days: 7
      - name: Build reports only after the raw artifact has an actual ID
        env:
          G1_RAW_ARTIFACT_ID: ${{ steps.raw.outputs.artifact-id }}
          G1_RAW_ARTIFACT_SHA256: ${{ steps.raw.outputs.artifact-digest }}
          G1_RAW_ARTIFACT_NAME: required-tests-raw-runtime-native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/produce-runtime-g1-smoke.mjs report
      - uses: actions/upload-artifact@v4
        with:
          name: required-tests-report-part-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-report
          if-no-files-found: error
          retention-days: 7

  g1-native-business:
    # Missing inputs still leave the unconditional required-tests gate failing.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.required_candidate_run_id != '' || inputs.required_candidate_artifact_id != '' || inputs.required_candidate_sha256 != '') }}
    needs: [control-contract, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUNTIME_TARGET: x86_64-unknown-linux-gnu
      G1_NATIVE_PLATFORM: linux
      G1_NATIVE_ARCH: x64
      G1_CANDIDATE_SHA256: ${{ inputs.required_candidate_sha256 }}
      RSRS_CORE_SDK_DIR: ${{ github.workspace }}/.sdk/x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate the exact frozen business input without private SDK credentials
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.required_candidate_run_id }}
          INPUT_ARTIFACT: ${{ inputs.required_candidate_artifact_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          for (const key of ['INPUT_RUN', 'INPUT_ARTIFACT']) assert.match(process.env[key] ?? '', /^[1-9][0-9]*$/);
          assert.match(process.env.G1_CANDIDATE_SHA256 ?? '', /^[a-f0-9]{64}$/);
          const base = `repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const api = path => JSON.parse(execFileSync('gh', ['api', `${base}/${path}`], {encoding: 'utf8'}));
          const run = api(`runs/${process.env.INPUT_RUN}`);
          const artifact = api(`artifacts/${process.env.INPUT_ARTIFACT}`);
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.head_sha, process.env.GITHUB_SHA);
          assert.equal(artifact.workflow_run.id, Number(process.env.INPUT_RUN));
          assert.equal(artifact.workflow_run.head_sha, process.env.GITHUB_SHA);
          assert.equal(artifact.expired, false);
          assert.ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 256 * 1024 * 1024);
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.required_candidate_artifact_id }}
          run-id: ${{ inputs.required_candidate_run_id }}
          github-token: ${{ github.token }}
          path: g1-input
      - name: Resolve only the CLI source sealed in the exact candidate bytes
        id: combination
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, readFileSync} from 'node:fs';
          const bytes = readFileSync('g1-input/candidate.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.G1_CANDIDATE_SHA256);
          const candidate = JSON.parse(bytes);
          assert.equal(candidate.schema, 2);
          assert.equal(candidate.frozen, true);
          assert.equal(candidate.gate, 'G1');
          assert.equal(candidate.components.runtime.source_sha, process.env.GITHUB_SHA);
          const sha = candidate.components.cli.source_sha;
          assert.match(sha, /^[a-f0-9]{40}$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `cli_sha=${sha}\n`);
          NODE
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-cli
          ref: ${{ steps.combination.outputs.cli_sha }}
          path: .cli-source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: risense-ai/respire-client2
          ref: 57bc070826949994c3f7ce9a64277160704bdfe5
          path: .client2-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the existing private credential and original desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus gnome-keyring libgtk-3-0t64 libwebkit2gtk-4.1-0 libx11-6
          python3 -m pip install --only-binary=:all: SecretStorage==3.3.3 jeepney==0.9.0 cryptography==46.0.3
          python3 -B .cli-source/scripts/dev-secret-service-keyring-selftest.py --self-test
          python3 -B .cli-source/scripts/test-native-account-candidate.py
      - name: Resolve the exact SDK payload and original archive cache keys
        id: sdk
        run: |
          cmp sdk/core-sdk.lock.json .cli-source/sdk/core-sdk.lock.json
          cmp sdk/core-sdk.lock.json crates/core-sdk/core-sdk.lock.json
          echo "key=$(node scripts/sdk-ci-cache.mjs key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
          echo "archive_key=$(node scripts/sdk-ci-cache.mjs archive-key "$RUNTIME_TARGET")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: payload
        with:
          path: .sdk/x86_64-unknown-linux-gnu
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: .sdk-archives/x86_64-unknown-linux-gnu
          key: ${{ steps.sdk.outputs.archive_key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Build only the actual current-source Runtime business harness
        env:
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.payload.outputs.cache-matched-key }}
          EXPECTED_ARCHIVE_KEY: ${{ steps.sdk.outputs.archive_key }}
          MATCHED_ARCHIVE_KEY: ${{ steps.archive.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -z "${CORE_SDK_READ_TOKEN:-}" && test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          test -n "$EXPECTED_KEY" && test "$EXPECTED_KEY" = "$MATCHED_KEY"
          test -n "$EXPECTED_ARCHIVE_KEY" && test "$EXPECTED_ARCHIVE_KEY" = "$MATCHED_ARCHIVE_KEY"
          node scripts/fetch-core-sdk.mjs "$RUNTIME_TARGET"
          test ! -e .cli-source/.sdk && cp -a .sdk .cli-source/.sdk
          test ! -e .cli-source/.sdk-archives && cp -a .sdk-archives .cli-source/.sdk-archives
          cargo test --locked -p respire_commands --features respire_app/cpu-owned-ort-experiment --example cli_business_tests --no-run --message-format=json --target-dir target > "$RUNNER_TEMP/g1-business-harness-build.jsonl"
          node scripts/stage-core-runtime.mjs target/debug/examples
      - name: Execute the existing exact business cases and original Client2 on frozen product bytes
        run: |
          set -euo pipefail
          test ! -e release-assets
          mv g1-input/release-assets release-assets
          chmod 700 "release-assets/rsrs-runtime-$RUNTIME_TARGET" "g1-input/cli-assets/rsrs-$RUNTIME_TARGET" g1-input/client2-assets/respire
          node scripts/produce-runtime-g1-business.mjs run
      - name: Upload only this attempt's safe original business evidence
        id: raw
        uses: actions/upload-artifact@v4
        with:
          name: required-tests-raw-runtime-business-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-business-raw
          if-no-files-found: error
          retention-days: 7
      - name: Bind business reports to the actual upload result
        env:
          G1_RAW_ARTIFACT_ID: ${{ steps.raw.outputs.artifact-id }}
          G1_RAW_ARTIFACT_SHA256: ${{ steps.raw.outputs.artifact-digest }}
          G1_RAW_ARTIFACT_NAME: required-tests-raw-runtime-business-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/produce-runtime-g1-business.mjs report
      - uses: actions/upload-artifact@v4
        with:
          name: required-tests-report-business-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-business-report
          if-no-files-found: error
          retention-days: 7

  g1-report:
    if: ${{ !cancelled() && needs.g1-native-smoke.result == 'success' && needs.g1-native-business.result == 'success' }}
    needs: [g1-native-smoke, g1-native-business]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: required-tests-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-parts
      - name: Require identical frozen bytes and all selected native legs
        env:
          G1_CANDIDATE_SHA256: ${{ inputs.required_candidate_sha256 }}
          G1_TARGETS: '["x86_64-unknown-linux-gnu","aarch64-apple-darwin"]'
        run: node scripts/produce-runtime-g1-smoke.mjs bundle
      - uses: actions/upload-artifact@v4
        with:
          name: required-tests-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-final
          if-no-files-found: error
          retention-days: 7

  required-tests:
    if: always()
    needs: [control-contract, detect, workspace-tests, g1-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A separate producer uploads raw execution evidence first, then this report bundle.
      # No report producer is implied by a source-test or syntax-check job.
      - name: Download this exact attempt's required execution reports
        uses: actions/download-artifact@v4
        with:
          name: required-tests-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/required-tests
      - name: Require every Stage 1 test and matrix leg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-required-tests.mjs --ci

  ci-complete:
    if: always()
    needs: [control-contract, detect, workspace-tests, required-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all source gates
        env:
          WORKSPACE_PRESENT: ${{ needs.detect.outputs.workspace_present }}
          TESTS_RESULT: ${{ needs.workspace-tests.result }}
          CONTRACT_RESULT: ${{ needs.control-contract.result }}
          REQUIRED_RESULT: ${{ needs.required-tests.result }}
        run: |
          test "$CONTRACT_RESULT" = success || { echo "::error::Runtime control contract did not pass"; exit 1; }
          test "$REQUIRED_RESULT" = success || { echo "::error::Required Stage 1 tests did not pass"; exit 1; }
          test "$WORKSPACE_PRESENT" = true || { echo "::error::Required workspace is missing"; exit 1; }
          test "$TESTS_RESULT" = success || { echo "::error::Source tests did not pass"; exit 1; }
