[package]
name = "respire_client_host"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Runtime startup identity and low-level host helpers"
license-file = "../../LICENSE"
publish = false

[features]
locks = ["dep:rusqlite"]

[dependencies]
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"
