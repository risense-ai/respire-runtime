[package]
name = "respire_runtime"
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.88"
description = "standalone respire runtime binary (rsrs-runtime): loopback RPC host for the CLI and client2"
license-file = "../LICENSE"
repository = "https://github.com/risense-ai/respire-cli"
publish = false

[[bin]]
name = "rsrs-runtime"
path = "src/main.rs"

[dependencies]
respire_host_commands = { path = "../crates/host-commands" }
respire_frontend = { package = "respire_host_frontend", path = "../host-frontend/cli" }
respire_host_control = { path = "../crates/host-control", features = ["runtime-host"] }
respire_client_host = { path = "../crates/client-host", features = ["locks"] }
url = "2.5"
respire_app = { package = "respire_app", path = "../crates/app", default-features = false }
respire_commands = { path = "../crates/commands" }
respire_core_sdk = { path = "../crates/core-sdk" }
respire_protocol = { path = "../crates/protocol" }
# Boot-token consumption stays aligned with the spawner semantics (P2 moves
# this crate into the runtime repository together with respire_spawn).
respire_spawn = { path = "../spawn" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
